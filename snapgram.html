<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snapgram</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Snapgram">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#000;--mut:#737373;--line:#dbdbdb;--blue:#0095f6;--red:#ed4956;--chip:#efefef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--chip:#262626}}
:root[data-theme="dark"]{--bg:#000;--fg:#f5f5f5;--mut:#a8a8a8;--line:#262626;--chip:#262626}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#app{max-width:470px;margin:0 auto;min-height:100%;padding-bottom:56px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.logo{font:italic 700 26px/1 "Billabong","Snell Roundhand","Brush Script MT","Segoe Script",cursive;letter-spacing:.5px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.fill svg{fill:currentColor}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;flex:none;font-size:12px}
.st span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.ring.seen{background:var(--line)}
.ring .av{border:3px solid var(--bg)}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:600;color:#fff}
.sm{width:32px;height:32px;font-size:14px;flex:none}
.post{border-bottom:1px solid var(--line);padding-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px}
.ph b{font-weight:600}.ph small{color:var(--mut)}
.ph .more{margin-left:auto}
.img{position:relative;aspect-ratio:1;display:grid;place-items:center;font-size:110px;user-select:none;overflow:hidden}
.heart{position:absolute;width:96px;height:96px;fill:#fff;stroke:none;opacity:0;transform:scale(.3);pointer-events:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.heart.pop{animation:pop .8s ease}
@keyframes pop{15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.bar{display:flex;gap:14px;padding:10px 12px 4px;align-items:center}
.bar .sv{margin-left:auto}
.liked{color:var(--red)}.liked svg{fill:var(--red)}
.sv.on svg{fill:currentColor}
.txt{padding:0 12px}.txt p{margin:3px 0}
.mut{color:var(--mut)}
.cmt{display:flex;gap:8px;padding:6px 12px 0}
.cmt input{flex:1;background:none;border:0;outline:0;color:inherit;font:inherit;padding:4px 0}
.cmt button{color:var(--blue);font-weight:600}
.cmt button:disabled{opacity:.4}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:470px;margin:0 auto;display:flex;justify-content:space-around;height:50px;align-items:center}
nav button{padding:10px 18px;opacity:.6}nav button.on{opacity:1}nav button.on svg{stroke-width:2.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid .t{aspect-ratio:1;display:grid;place-items:center;font-size:44px;cursor:pointer}
.search{margin:10px 12px;display:block;width:calc(100% - 24px);padding:9px 12px;border:0;border-radius:10px;background:var(--chip);color:inherit;font:inherit;outline:0}
.prof{display:flex;align-items:center;gap:24px;padding:16px}
.prof .av{width:84px;height:84px;font-size:34px;flex:none}
.stats{display:flex;gap:22px;text-align:center}.stats b{display:block;font-size:16px}
.bio{padding:0 16px 14px}
.btns{display:flex;gap:8px;padding:0 16px 14px}
.btns button{flex:1;background:var(--chip);border-radius:8px;padding:7px;font-weight:600}
.create{padding:14px}
.create .img{border-radius:6px;margin-bottom:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;font-size:18px;background:var(--chip)}
.sw button.on{border-color:var(--fg)}
.create textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;background:none;color:inherit;font:inherit;padding:10px;margin-bottom:12px;resize:none}
.go{width:100%;background:var(--blue);color:#fff;border-radius:8px;padding:10px;font-weight:600}
#story{position:fixed;inset:0;z-index:20;display:none;place-items:center;font-size:150px;color:#fff}
#story.on{display:grid}
#story .pb{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden}
#story .pb i{display:block;height:100%;width:0;background:#fff}
#story .pb i.run{width:100%;transition:width 4s linear}
#story .who{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:12px;display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
#story .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);right:12px;color:#fff}
.empty{text-align:center;color:var(--mut);padding:48px 24px}
.out header,.out nav{display:none}
.auth{max-width:350px;margin:0 auto;padding:40px 24px;text-align:center}
.auth .logo{font-size:44px;display:block;margin:20px 0 10px}
.auth input{display:block;width:100%;margin-bottom:8px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:inherit;font:inherit;outline:0}
.auth .err{color:var(--red);min-height:18px;margin:8px 0;font-size:13px}
.auth .sw2{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:6px}
.auth .sw2 button{color:var(--blue);font-weight:600}

.row{display:flex;align-items:center;gap:12px;padding:8px 14px;cursor:pointer}
.row .rn{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rn b{font-weight:600}
.rn svg{width:13px;height:13px;display:inline;vertical-align:-2px}
.fb{background:var(--blue);color:#fff;border-radius:8px;padding:6px 14px;font-weight:600;margin-left:6px}
.fb.on,.fb.req{background:var(--chip);color:var(--fg)}
.btns .fb{margin:0;padding:7px;background:var(--blue);color:#fff}
.btns .fb.on,.btns .fb.req{background:var(--chip);color:var(--fg)}
.lh{padding:12px 14px 6px;font-size:15px}
.stats button{text-align:center}
nav button{position:relative}
.dot{position:absolute;top:8px;right:12px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.empty svg{width:40px;height:40px;margin:0 auto 8px}
</style>
</head>
<body>
<div id="app"><header><span class="logo">Snapgram</span><div id="hr" style="display:flex;gap:16px"></div></header><main id="main"></main></div>
<nav><div id="nav"></div></nav>
<div id="story"><div class="pb"><i></i></div><div class="who"></div><button class="x" aria-label="Close"></button><span class="em"></span></div>

<script>
const I={
home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="M21 21l-5-5"/></svg>',
add:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>',
heart:'<svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21z"/></svg>',
user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
cmt:'<svg viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3 21l1.5-5.2A8.5 8.5 0 1 1 21 12z"/></svg>',
send:'<svg viewBox="0 0 24 24"><path d="M22 3L9.5 13.5M22 3l-7 18-5.5-7.5L2 9z"/></svg>',
save:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>',
dots:'<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
x:'<svg viewBox="0 0 24 24" style="stroke:#fff"><path d="M5 5l14 14M19 5L5 19"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'};
const G=['linear-gradient(135deg,#f9d423,#ff4e50)','linear-gradient(135deg,#43cea2,#185a9d)','linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#0f2027,#2c5364)','linear-gradient(135deg,#ff9a9e,#fad0c4)','linear-gradient(135deg,#667eea,#764ba2)'];
const E=['🌅','🐶','🍕','🏔️','🎸','☕','🌊','🚲'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(_){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}};

/* ---- data: only real accounts created on this device ---- */
let users=ld('sg_users',{}),posts=ld('sg_posts',[]),stories=ld('sg_stories',[]);
const U={},byName=n=>Object.values(users).find(u=>u.user===n);
Object.values(users).forEach(u=>{U[u.user]=u.bg;u.following=u.following||[];u.req=u.req||[]});
posts=posts.filter(p=>byName(p.u)).map(p=>{p.l=Array.isArray(p.l)?p.l:[];p.s=Array.isArray(p.s)?p.s:[];p.c=(p.c||[]).filter(c=>byName(c.u));return p});
stories=stories.filter(s=>byName(s.u)&&Date.now()-s.ts<864e5);
const persist=()=>{const a=sv('sg_users',users),b=sv('sg_posts',posts),c=sv('sg_stories',stories);return a&&b&&c};
persist();

let me='',view='home',cur='',lk='',stack=[],q='',cg=0,ce=0,img='',capT='',asStory=false,mode='signup',seen={};
let nid=Math.max(0,...posts.map(p=>p.id),...stories.map(p=>p.id))+1;
const meU=()=>byName(me);
const followers=n=>Object.values(users).filter(u=>u.following.includes(n)).map(u=>u.user);
const isF=(a,b)=>byName(a).following.includes(b);
const canSee=n=>n===me||!byName(n).private||isF(me,n);
const activeSt=n=>stories.some(x=>x.u===n&&Date.now()-x.ts<864e5);
const bgs=p=>p.img?`url(${p.img}) center/cover`:p.bg;
const av=(u,c='')=>`<div class="av ${c}" style="background:${U[u]}">${u[0].toUpperCase()}</div>`;
const ago=p=>{if(!p.ts)return p.t||'';const s=(Date.now()-p.ts)/1e3;return s<60?'now':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d'};
const hash=async(s,salt)=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

function follow(n){
  const t=byName(n),m=meU();
  if(m.following.includes(n))m.following=m.following.filter(x=>x!==n);
  else if(t.req.includes(me))t.req=t.req.filter(x=>x!==me);
  else if(t.private)t.req.push(me);
  else m.following.push(n);
  persist();
}
function fbtn(n){
  if(n===me)return '';
  const t=byName(n),m=meU();
  const st=m.following.includes(n)?'on':t.req.includes(me)?'req':'';
  const lbl=st==='on'?'Following':st==='req'?'Requested':(t.following.includes(me)?'Follow back':'Follow');
  return `<button class="fb ${st}" data-act="follow" data-n="${n}">${lbl}</button>`;
}

/* ---- navigation ---- */
function go(v,c='',l=''){stack.push([view,cur,lk]);view=v;cur=c;lk=l;scrollTo(0,0);render()}
function tab(v,c=''){stack=[];view=v;cur=c;lk='';q='';scrollTo(0,0);render()}
function back(){const s=stack.pop();if(s){[view,cur,lk]=s;render()}else tab('home')}

/* ---- views ---- */
function renderHead(){$('header').innerHTML=`<div style="display:flex;gap:12px;align-items:center">${stack.length?`<button data-act="back" aria-label="Back">${I.back}</button>`:''}<span class="logo">Snapgram</span></div>`}
function renderNav(){
  const n=[['home',I.home],['search',I.search],['add',I.add],['heart',I.heart],['user',I.user]];
  const on=view==='profile'&&cur===me?'user':view,rq=meU().req.length;
  $('#nav').innerHTML=n.map(([k,i])=>`<button data-tab="${k}" class="${on===k?'on':''}" aria-label="${k}">${i}${k==='heart'&&rq?'<i class="dot"></i>':''}</button>`).join('');
}
function row(n,extra=''){
  const u=byName(n),c=followers(n).length;
  return `<div class="row" data-user="${n}">${av(n,'sm')}<div class="rn"><span><b>${n}</b>${u.private?' '+I.lock:''}</span><small class="mut">${c} follower${c===1?'':'s'}</small></div>${extra}</div>`;
}
function postHTML(p){
  const lk=p.l.includes(me),sd=p.s.includes(me);
  return `<article class="post" data-id="${p.id}">
  <div class="ph" data-user="${p.u}">${av(p.u,'sm')}<b>${p.u}</b><small>• ${ago(p)}</small>${p.u===me?`<button class="more" data-act="del" aria-label="Delete post">${I.dots}</button>`:''}</div>
  <div class="img" data-dbl style="background:${bgs(p)}">${p.img?'':p.e}<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-8.5-5.2-8.5-11.2A4.8 4.8 0 0 1 12 7a4.8 4.8 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21z"/></svg></div>
  <div class="bar"><button data-act="like" class="${lk?'liked':''}" aria-label="Like">${I.heart}</button><button data-act="focus" aria-label="Comment">${I.cmt}</button><button data-act="share" aria-label="Share">${I.send}</button><button data-act="save" class="sv ${sd?'on':''}" aria-label="Save">${I.save}</button></div>
  <div class="txt"><p><b>${p.l.length} like${p.l.length===1?'':'s'}</b></p>${p.cap?`<p><b>${p.u}</b> ${esc(p.cap)}</p>`:''}
  ${p.c.length>2&&!p.all?`<p><button class="mut" data-act="all">View all ${p.c.length} comments</button></p>`:''}
  ${(p.all?p.c:p.c.slice(-2)).map(c=>`<p><b>${c.u}</b> ${esc(c.t)}</p>`).join('')}</div>
  <div class="cmt"><input placeholder="Add a comment…" maxlength="200"><button disabled data-act="post">Post</button></div></article>`;
}
const tile=p=>`<div class="t" style="background:${bgs(p)}" data-post="${p.id}">${p.img?'':p.e}</div>`;
function home(){
  const m=meU(),vis=posts.filter(p=>p.u===me||m.following.includes(p.u));
  const names=[me,...m.following.filter(n=>byName(n)&&activeSt(n))];
  return `<div class="stories">${names.map(n=>`<button class="st" data-story="${n}"><div class="ring ${(n===me&&!activeSt(me))||seen[n]?'seen':''}">${av(n)}</div><span>${n===me?'Your story':n}</span></button>`).join('')}</div>
  ${vis.length?vis.map(postHTML).join(''):'<div class="empty"><b style="color:var(--fg)">Welcome to Snapgram</b><br>Your feed is empty. Search for people to follow, or share your first post.</div>'}`;
}
function search(){
  const r=Object.values(users).map(u=>u.user).filter(n=>n!==me&&n.includes(q.toLowerCase()));
  const pub=posts.filter(p=>p.u!==me&&!byName(p.u).private);
  return `<input class="search" id="q" placeholder="Search accounts" value="${esc(q)}">
  ${r.length?r.map(n=>row(n,fbtn(n))).join(''):`<div class="empty">${q?'No accounts found.':'No other accounts yet. Ask friends to sign up and they will show up here.'}</div>`}
  ${!q&&pub.length?`<div class="lh"><b>Public posts</b></div><div class="grid">${pub.map(tile).join('')}</div>`:''}`;
}
function create(){
  return `<div class="create"><div class="img" id="prev" style="background:${img?`url(${img}) center/cover`:G[cg]}">${img?'':E[ce]}</div>
  <div class="btns" style="padding:0 0 12px"><button data-act="pick">${img?'Change photo':'Choose photo from gallery'}</button>${img?'<button data-act="nopic">Remove photo</button>':''}</div><input type="file" id="file" accept="image/*" hidden>
  <div class="sw">${G.map((g,i)=>`<button data-cg="${i}" class="${i===cg?'on':''}" style="background:${g}" aria-label="Color ${i+1}"></button>`).join('')}</div>
  <div class="sw">${E.map((e,i)=>`<button data-ce="${i}" class="${i===ce?'on':''}">${e}</button>`).join('')}</div>
  <textarea id="cap" placeholder="Write a caption…" maxlength="150">${esc(capT)}</textarea>
  <label class="chk"><input type="checkbox" id="st" ${asStory?'checked':''}> Share as story (24 hours)</label>
  <button class="go" data-act="publish">${asStory?'Share story':'Share post'}</button></div>`;
}
function activity(){
  const rq=meU().req;
  return `<div class="lh"><b>Follow requests</b></div>${rq.length?rq.map(n=>row(n,`<button class="fb" data-act="acc" data-n="${n}">Confirm</button><button class="fb on" data-act="dec" data-n="${n}">Delete</button>`)).join(''):'<div class="empty">No follow requests.</div>'}`;
}
function profile(n){
  const u=byName(n);if(!u)return '<div class="empty">Account not found.</div>';
  const mine=n===me,ok=canSee(n),ps=posts.filter(p=>p.u===n);
  const stat=(k,v)=>ok?`<button data-list="${k}" data-n="${n}"><b>${v}</b>${k}</button>`:`<div><b>${v}</b>${k}</div>`;
  return `<div class="prof">${av(n)}<div class="stats"><div><b>${ps.length}</b>posts</div>${stat('followers',followers(n).length)}${stat('following',u.following.length)}</div></div>
  <div class="bio"><b>${n}</b>${u.private?' '+I.lock:''}<br>${esc(u.bio||'')}</div>
  <div class="btns">${mine?`<button data-act="bio">Edit bio</button><button data-act="priv">${u.private?'Make public':'Make private'}</button>`:fbtn(n)}</div>
  ${mine?'<div class="btns"><button data-act="theme">Theme</button><button data-act="logout">Log out</button></div>':''}
  ${ok?(ps.length?`<div class="grid">${ps.map(tile).join('')}</div>`:'<div class="empty">No posts yet.</div>'):`<div class="empty">${I.lock}<br><b style="color:var(--fg)">This account is private</b><br>Follow this account to see their photos.</div>`}`;
}
function list(n,k){
  const u=byName(n);if(!u||!canSee(n))return '<div class="empty">This list is private.</div>';
  const names=(k==='followers'?followers(n):u.following).filter(x=>byName(x));
  const ex=x=>n===me&&k==='followers'?`<button class="fb on" data-act="rm" data-n="${x}">Remove</button>`:fbtn(x);
  return `<div class="lh"><b>${k==='followers'?'Followers':'Following'}</b> of ${n}</div>${names.length?names.map(x=>row(x,ex(x))).join(''):'<div class="empty">Nobody here yet.</div>'}`;
}
function postView(){const p=posts.find(x=>x.id==cur);return p&&canSee(p.u)?postHTML(p):'<div class="empty">Post not available.</div>'}

function showAuth(){
  const su=mode==='signup';
  $('#main').innerHTML=`<div class="auth"><span class="logo">Snapgram</span><p class="mut">${su?'Sign up with your Gmail to share photos and follow friends.':'Welcome back. Log in to continue.'}</p>
  <input id="em" type="email" placeholder="Gmail address" autocomplete="email">${su?'<input id="un" placeholder="Username" maxlength="20" autocomplete="username">':''}
  <input id="pw" type="password" placeholder="Password" autocomplete="${su?'new-password':'current-password'}">${su?'<input id="pw2" type="password" placeholder="Confirm password">':''}
  <div class="err" id="err"></div><button class="go" data-act="auth">${su?'Sign up':'Log in'}</button>
  <div class="sw2">${su?'Have an account? <button data-act="mode">Log in</button>':'New here? <button data-act="mode">Sign up</button>'}</div></div>`;
}
async function doAuth(){
  const err=m=>{$('#err').textContent=m};
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!/^[a-z0-9._%+-]+@gmail\.com$/.test(em))return err('Enter a valid Gmail address (name@gmail.com).');
  if(mode==='signup'){
    const un=$('#un').value.trim().toLowerCase();
    if(!/^[a-z0-9._]{3,20}$/.test(un))return err('Username: 3\u201320 letters, numbers, . or _');
    if(pw.length<6)return err('Password must be at least 6 characters.');
    if(pw!==$('#pw2').value)return err('Passwords don\u2019t match.');
    if(users[em])return err('This Gmail already has an account. Log in instead.');
    if(byName(un))return err('Username is taken.');
    const salt=crypto.getRandomValues(new Uint32Array(2)).join('-');
    users[em]={user:un,salt,hash:await hash(pw,salt),bg:G[Math.floor(Math.random()*6)],following:[],req:[],private:false,bio:''};
    if(!sv('sg_users',users)){delete users[em];return err('Couldn\u2019t save the account. Allow browser storage and try again.')}
  }else{
    const u=users[em];
    if(!u||u.hash!==await hash(pw,u.salt))return err('Wrong Gmail or password.');
  }
  const u=users[em];U[u.user]=u.bg;me=u.user;sv('sg_session',em);stack=[];view='home';render();
}
function render(){
  document.body.classList.toggle('out',!me);
  if(!me){showAuth();return}
  renderHead();renderNav();
  $('#main').innerHTML=view==='home'?home():view==='search'?search():view==='add'?create():view==='heart'?activity():view==='list'?list(cur,lk):view==='post'?postView():profile(cur);
  if(view==='search'){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}
}

/* ---- actions ---- */
const find=el=>posts.find(p=>p.id==el.closest('.post').dataset.id);
function patch(el,p){const a=el.closest('.post');const t=document.createElement('div');t.innerHTML=postHTML(p);a.replaceWith(t.firstElementChild)}
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}
function act(b){
  const a=b.dataset.act,n=b.dataset.n,m=me&&meU();
  if(a==='back')return back();
  if(a==='mode'){mode=mode==='signup'?'login':'signup';return render()}
  if(a==='auth')return doAuth();
  if(a==='logout'){me='';sv('sg_session','');stack=[];view='home';return render()}
  if(a==='theme'){const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#000';r.dataset.theme=d?'light':'dark';return}
  if(a==='follow'){follow(n);return render()}
  if(a==='rm'){const f=byName(n);f.following=f.following.filter(x=>x!==me);persist();return render()}
  if(a==='acc'){const x=byName(n);if(x&&!x.following.includes(me))x.following.push(me);m.req=m.req.filter(r=>r!==n);persist();return render()}
  if(a==='dec'){m.req=m.req.filter(r=>r!==n);persist();return render()}
  if(a==='priv'){m.private=!m.private;if(!m.private){m.req.forEach(r=>{const x=byName(r);if(x&&!x.following.includes(me))x.following.push(me)});m.req=[]}persist();return render()}
  if(a==='bio'){const v=prompt('Your bio',m.bio||'');if(v!==null){m.bio=v.trim().slice(0,100);persist();render()}return}
  if(a==='pick'){$('#file').click();return}
  if(a==='nopic'){img='';return render()}
  if(a==='publish'){
    const o={id:nid++,u:me,bg:G[cg],e:E[ce],img,cap:capT.trim(),ts:Date.now()};
    if(asStory)stories.push(o);else{o.cap=o.cap||'New post';o.l=[];o.s=[];o.c=[];posts.unshift(o)}
    if(!persist()){asStory?stories.pop():posts.shift();alert('Storage is full. Remove the photo or pick a smaller one.');return}
    img='';capT='';asStory=false;return tab('home');
  }
  const p=find(b);
  if(a==='del'){if(confirm('Delete this post?')){posts=posts.filter(x=>x.id!==p.id);persist();render()}return}
  if(a==='like'){toggle(p.l,me);patch(b,p)}
  else if(a==='save'){toggle(p.s,me);patch(b,p)}
  else if(a==='all'){p.all=true;patch(b,p)}
  else if(a==='focus'){b.closest('.post').querySelector('.cmt input').focus()}
  else if(a==='share'){const t=`${p.u} on Snapgram: ${p.cap}`;try{navigator.share?navigator.share({text:t}).catch(()=>{}):navigator.clipboard.writeText(t)}catch(_){}}
  else if(a==='post'){const i=b.closest('.cmt').querySelector('input'),v=i.value.trim();if(v){p.c.push({u:me,t:v});patch(b,p)}}
  persist();
}
document.addEventListener('click',e=>{
  const t=e.target;
  const b=t.closest('[data-act]');if(b){act(b);return}
  const l=t.closest('[data-list]');if(l){go('list',l.dataset.n,l.dataset.list);return}
  const u=t.closest('[data-user]');if(u){const n=u.dataset.user;if(!(view==='profile'&&cur===n))go('profile',n);return}
  const pp=t.closest('[data-post]');if(pp){go('post',pp.dataset.post);return}
  const s=t.closest('[data-story]');if(s){const n=s.dataset.story;if(n===me&&!activeSt(me)){asStory=true;tab('add')}else openStory(n);return}
  const g=t.closest('[data-tab]');if(g){g.dataset.tab==='user'?tab('profile',me):tab(g.dataset.tab);return}
  const c1=t.closest('[data-cg]');if(c1){cg=+c1.dataset.cg;img='';render();return}
  const c2=t.closest('[data-ce]');if(c2){ce=+c2.dataset.ce;render();return}
});
document.addEventListener('dblclick',e=>{
  const d=e.target.closest('[data-dbl]');if(!d)return;
  const a=d.closest('.post'),p=find(d);
  const h=d.querySelector('.heart');h.classList.remove('pop');void h.getBoundingClientRect();h.classList.add('pop');
  if(!p.l.includes(me)){p.l.push(me);persist();a.querySelector('.bar button').classList.add('liked');a.querySelector('.txt b').textContent=`${p.l.length} like${p.l.length===1?'':'s'}`}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value;render()}
  else if(t.id==='cap')capT=t.value;
  else if(t.closest('.cmt'))t.nextElementSibling.disabled=!t.value.trim();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.cmt')){e.preventDefault();e.target.nextElementSibling.click()}});
document.addEventListener('change',e=>{
  if(e.target.id==='st'){asStory=e.target.checked;render();return}
  const f=e.target.id==='file'&&e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);img=c.toDataURL('image/jpeg',.72);render()};im.src=r.result};r.readAsDataURL(f);
});

let tm;
function openStory(n){
  const st=stories.filter(x=>x.u===n&&Date.now()-x.ts<864e5).pop();if(!st)return;
  const s=$('#story');s.style.background=bgs(st);
  s.querySelector('.em').textContent=st.img?'':st.e;
  s.querySelector('.who').innerHTML=`<span style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center">${n[0].toUpperCase()}</span>${n===me?'Your story':n}`;
  s.querySelector('.x').innerHTML=I.x;
  const i=s.querySelector('i');i.className='';void i.offsetWidth;i.className='run';
  s.classList.add('on');seen[n]=1;clearTimeout(tm);tm=setTimeout(closeStory,4000);
}
function closeStory(){clearTimeout(tm);$('#story').classList.remove('on');if(view==='home'&&me)render()}
$('#story').addEventListener('click',closeStory);

const s0=ld('sg_session','');if(users[s0])me=users[s0].user;
render();
</script>
